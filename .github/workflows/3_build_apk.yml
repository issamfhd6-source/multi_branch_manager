name: 3 - Build Release APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Drift files if needed
        run: |
          if grep -rn "@DriftDatabase" lib/ >/dev/null 2>&1; then
            dart run build_runner build --delete-conflicting-outputs
          fi

      - name: Prepare Android SDK and project
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=$(find "$SDK_DIR" -name "sdkmanager" -type f 2>/dev/null | head -n 1)
          if [ -n "$SDKMANAGER" ]; then
            rm -rf "$SDK_DIR/platforms/android-35" "$SDK_DIR/platforms/android-35.bak"
            yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" "platforms;android-35" "build-tools;35.0.0" || true
          fi

          rm -rf android
          flutter create --platforms=android --org com.example .

          cat << 'SCRIPT' > /tmp/prep.py
          import pathlib, re

          ver = "2.0.21"
          for p in pathlib.Path("android").rglob("*"):
              if p.is_file() and p.name in {
                  "settings.gradle",
                  "settings.gradle.kts",
                  "build.gradle",
                  "build.gradle.kts",
              }:
                  txt = p.read_text(encoding="utf-8")
                  txt = re.sub(
                      r'(org\.jetbrains\.kotlin\.android["\']?\s*\)?\s*(?:version\s*)?["\'])[0-9]+\.[0-9]+\.[0-9]+',
                      r'\g<1>' + ver,
                      txt,
                  )
                  txt = re.sub(
                      r'(kotlin_version\s*=\s*["\'])[0-9]+\.[0-9]+\.[0-9]+',
                      r'\g<1>' + ver,
                      txt,
                  )
                  p.write_text(txt, encoding="utf-8")

          for p in pathlib.Path("android/app").glob("build.gradle*"):
              kts = p.name.endswith(".kts")
              lines = p.read_text(encoding="utf-8").splitlines()
              out = []
              for ln in lines:
                  s = ln.lstrip()
                  ind = ln[: len(ln) - len(s)]
                  if re.match(r"^(compileSdkVersion|compileSdk)\b", s):
                      out.append(f"{ind}compileSdk = 35" if kts else f"{ind}compileSdk 35")
                  elif re.match(r"^(targetSdkVersion|targetSdk)\b", s):
                      out.append(f"{ind}targetSdk = 35" if kts else f"{ind}targetSdk 35")
                  elif re.match(r"^(minSdkVersion|minSdk)\b", s):
                      out.append(f"{ind}minSdk = 21" if kts else f"{ind}minSdk 21")
                  else:
                      out.append(ln)
              p.write_text("\n".join(out) + "\n", encoding="utf-8")
          SCRIPT

          python3 /tmp/prep.py

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: multi-branch-manager-apk
          path: build/app/outputs/flutter-apk/app-release.apk
