name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Drift files if needed
        run: |
          if grep -rn "@DriftDatabase" lib/ >/dev/null 2>&1; then
            dart run build_runner build --delete-conflicting-outputs
          fi

      - name: Static analysis
        run: flutter analyze

      - name: Prepare Android project
        run: |
          rm -rf android
          flutter create --platforms=android --org com.example .
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ -d "$SDK_DIR/platforms/android-35.bak" ] && [ ! -d "$SDK_DIR/platforms/android-35" ]; then
            mv "$SDK_DIR/platforms/android-35.bak" "$SDK_DIR/platforms/android-35" || true
          fi
          find android -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) -exec sed -i -E 's/(org\.jetbrains\.kotlin\.android["\x27]?\)?\s*(version\s*)?["\x27])[0-9]+\.[0-9]+\.[0-9]+/\12.0.21/g' {} +
          find android -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) -exec sed -i -E 's/(kotlin_version\s*=\s*["\x27])[0-9]+\.[0-9]+\.[0-9]+/\12.0.21/g' {} +
          find android -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) -exec sed -i -E 's/(compileSdk(Version)?\s*(=|\s)\s*)[0-9]+/\134/g' {} +
          find android -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) -exec sed -i -E 's/(targetSdk(Version)?\s*(=|\s)\s*)[0-9]+/\134/g' {} +
          find android -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) -exec sed -i -E 's/(minSdk(Version)?\s*(=|\s)\s*)[0-9]+/\121/g' {} +

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: multi-branch-manager-apk
          path: build/app/outputs/flutter-apk/app-release.apk
