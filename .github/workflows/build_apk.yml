name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Drift files if needed
        run: |
          if grep -rn "@DriftDatabase" lib/ >/dev/null 2>&1; then
            dart run build_runner build --delete-conflicting-outputs
          fi

      - name: Static analysis
        run: flutter analyze

      - name: Prepare Android project & SDK versions
        run: |
          rm -rf android
          flutter create --platforms=android --org com.example .
          python3 - <<'EOF'
          import pathlib, re

          def patch_gradle_file(path_str: str, is_kts: bool) -> None:
              p = pathlib.Path(path_str)
              if not p.exists():
                  return
              lines = p.read_text(encoding="utf-8").splitlines()
              out = []
              for line in lines:
                  stripped = line.lstrip()
                  indent = line[:len(line) - len(stripped)]
                  if re.match(r'^(compileSdkVersion|compileSdk)\b', stripped):
                      out.append(f"{indent}compileSdk = 34" if is_kts else f"{indent}compileSdk 34")
                  elif re.match(r'^(targetSdkVersion|targetSdk)\b', stripped):
                      out.append(f"{indent}targetSdk = 34" if is_kts else f"{indent}targetSdk 34")
                  elif re.match(r'^(minSdkVersion|minSdk)\b', stripped):
                      out.append(f"{indent}minSdk = 21" if is_kts else f"{indent}minSdk 21")
                  else:
                      out.append(line)
              p.write_text("\n".join(out) + "\n", encoding="utf-8")

          patch_gradle_file("android/app/build.gradle", False)
          patch_gradle_file("android/app/build.gradle.kts", True)
          EOF

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: multi-branch-manager-apk
          path: build/app/outputs/flutter-apk/app-release.apk
