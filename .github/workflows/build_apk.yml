name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Drift files if needed
        run: |
          if grep -rn "@DriftDatabase" lib/ >/dev/null 2>&1; then
            dart run build_runner build --delete-conflicting-outputs
          fi

      - name: Static analysis
        run: flutter analyze

      - name: Prepare Android project & SDK versions
        run: |
          rm -rf android
          flutter create --platforms=android --org com.example .
          python3 - <<'EOF'
          import pathlib, re

          root_gradle = pathlib.Path("android/build.gradle")
          if root_gradle.exists():
              root_text = root_gradle.read_text(encoding="utf-8")
              ext_block = """buildscript {
              ext.kotlin_version = '1.9.24'
              ext.flutter = [
                  compileSdkVersion: 34,
                  targetSdkVersion: 34,
                  minSdkVersion: 21,
                  ndkVersion: "25.1.8937393"
              ]
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.3.2'
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
              }
          }
          """
              if "ext.flutter" not in root_text:
                  if "allprojects {" in root_text:
                      root_text = root_text.replace("allprojects {", ext_block + "\nallprojects {", 1)
                  else:
                      root_text = ext_block + "\n" + root_text
              root_gradle.write_text(root_text, encoding="utf-8")

          app_gradle = pathlib.Path("android/app/build.gradle")
          if app_gradle.exists():
              lines = app_gradle.read_text(encoding="utf-8").splitlines()
              out = []
              for line in lines:
                  s = line.lstrip()
                  ind = line[:len(line) - len(s)]
                  if re.match(r'^(compileSdkVersion|compileSdk)\b', s):
                      out.append(f"{ind}compileSdk 34")
                  elif re.match(r'^(targetSdkVersion|targetSdk)\b', s):
                      out.append(f"{ind}targetSdk 34")
                  elif re.match(r'^(minSdkVersion|minSdk)\b', s):
                      out.append(f"{ind}minSdk 21")
                  else:
                      out.append(line)
              app_gradle.write_text("\n".join(out) + "\n", encoding="utf-8")
          EOF

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: multi-branch-manager-apk
          path: build/app/outputs/flutter-apk/app-release.apk
