name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Drift files if needed
        run: |
          if grep -rn "@DriftDatabase" lib/ >/dev/null 2>&1; then
            dart run build_runner build --delete-conflicting-outputs
          fi

      - name: Static analysis
        run: flutter analyze

      - name: Prepare Android project
        run: |
          rm -rf android
          flutter create --platforms=android --org com.example .
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 34/g' android/app/build.gradle*
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdk 34/g' android/app/build.gradle*
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 34/g' android/app/build.gradle*
          sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdk 34/g' android/app/build.gradle*
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' android/app/build.gradle*
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdk 21/g' android/app/build.gradle*
          cat << 'EOF' >> android/build.gradle

          subprojects { project ->
              project.plugins.withId('com.android.library') {
                  project.android {
                      compileSdk 34
                  }
              }
              project.plugins.withId('com.android.application') {
                  project.android {
                      compileSdk 34
                  }
              }
          }
          EOF

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: multi-branch-manager-apk
          path: build/app/outputs/flutter-apk/app-release.apk
