name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Drift files if needed
        run: |
          if grep -rn "@DriftDatabase" lib/ >/dev/null 2>&1; then
            dart run build_runner build --delete-conflicting-outputs
          fi

      - name: Static analysis
        run: flutter analyze

      - name: Prepare Android project & SDK versions
        run: |
          rm -rf android
          flutter create --platforms=android --org com.example .
          python3 - <<'EOF'
          import pathlib, re

          kotlin_ver = "1.9.24"

          settings_gradle = pathlib.Path("android/settings.gradle")
          if settings_gradle.exists():
              s_text = settings_gradle.read_text(encoding="utf-8")
              s_text = re.sub(
                  r'(id\s+["\']org\.jetbrains\.kotlin\.android["\']\s+version\s+["\'])[^"\']+(["\'])',
                  rf'\g<1>{kotlin_ver}\g<2>',
                  s_text,
              )
              settings_gradle.write_text(s_text, encoding="utf-8")

          root_gradle = pathlib.Path("android/build.gradle")
          if root_gradle.exists():
              r_text = root_gradle.read_text(encoding="utf-8")
              ext_snippet = f"""ext {{
    kotlin_version = '{kotlin_ver}'
    flutter = [
        compileSdkVersion: 34,
        targetSdkVersion: 34,
        minSdkVersion: 21,
        ndkVersion: '25.1.8937393'
    ]
}}
"""
              if "ext.kotlin_version" in r_text:
                  r_text = re.sub(
                      r"ext\.kotlin_version\s*=\s*['\"][^'\"]+['\"]",
                      f"ext.kotlin_version = '{kotlin_ver}'",
                      r_text,
                  )
              if "flutter = [" not in r_text:
                  r_text = ext_snippet + "\n" + r_text
              root_gradle.write_text(r_text, encoding="utf-8")

          app_gradle = pathlib.Path("android/app/build.gradle")
          if app_gradle.exists():
              lines = app_gradle.read_text(encoding="utf-8").splitlines()
              out = []
              for line in lines:
                  s = line.lstrip()
                  ind = line[:len(line) - len(s)]
                  if re.match(r'^(compileSdkVersion|compileSdk)\b', s):
                      out.append(f"{ind}compileSdk 34")
                  elif re.match(r'^(targetSdkVersion|targetSdk)\b', s):
                      out.append(f"{ind}targetSdk 34")
                  elif re.match(r'^(minSdkVersion|minSdk)\b', s):
                      out.append(f"{ind}minSdk 21")
                  else:
                      out.append(line)
              app_gradle.write_text("\n".join(out) + "\n", encoding="utf-8")

          app_gradle_kts = pathlib.Path("android/app/build.gradle.kts")
          if app_gradle_kts.exists():
              lines = app_gradle_kts.read_text(encoding="utf-8").splitlines()
              out = []
              for line in lines:
                  s = line.lstrip()
                  ind = line[:len(line) - len(s)]
                  if re.match(r'^compileSdk\b', s):
                      out.append(f"{ind}compileSdk = 34")
                  elif re.match(r'^targetSdk\b', s):
                      out.append(f"{ind}targetSdk = 34")
                  elif re.match(r'^minSdk\b', s):
                      out.append(f"{ind}minSdk = 21")
                  else:
                      out.append(line)
              app_gradle_kts.write_text("\n".join(out) + "\n", encoding="utf-8")
          EOF

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: multi-branch-manager-apk
          path: build/app/outputs/flutter-apk/app-release.apk
