name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Drift files if needed
        run: |
          if grep -rn "@DriftDatabase" lib/ >/dev/null 2>&1; then
            dart run build_runner build --delete-conflicting-outputs
          fi

      - name: Static analysis
        run: flutter analyze

      - name: Prepare Android project
        run: |
          rm -rf android
          flutter create --platforms=android --org com.example .
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ -d "$SDK_DIR/platforms/android-35.bak" ] && [ ! -d "$SDK_DIR/platforms/android-35" ]; then
            mv "$SDK_DIR/platforms/android-35.bak" "$SDK_DIR/platforms/android-35" || true
          fi
          python3 - <<'EOF'
          import pathlib, re

          kotlin_ver = "2.0.21"

          def update_kotlin_version(text: str) -> str:
              text = re.sub(
                  r'(id\s*\(?\s*["\']org\.jetbrains\.kotlin\.android["\']\s*\)?\s*(?:version\s*)?["\'])[^"\']+(["\'])',
                  rf'\g<1>{kotlin_ver}\g<2>',
                  text,
              )
              text = re.sub(
                  r'(kotlin\s*\(\s*["\']android["\']\s*\)\s*version\s*["\'])[^"\']+(["\'])',
                  rf'\g<1>{kotlin_ver}\g<2>',
                  text,
              )
              text = re.sub(
                  r'(org\.jetbrains\.kotlin:kotlin-gradle-plugin:)[^"\'\s]+',
                  rf'\g<1>{kotlin_ver}',
                  text,
              )
              text = re.sub(
                  r"(ext\.kotlin_version\s*=\s*)['\"][^'\"]+['\"]",
                  rf"\g<1>'{kotlin_ver}'",
                  text,
              )
              return text

          for fname in [
              "android/settings.gradle",
              "android/settings.gradle.kts",
              "android/build.gradle",
              "android/build.gradle.kts",
          ]:
              p = pathlib.Path(fname)
              if p.exists():
                  p.write_text(update_kotlin_version(p.read_text(encoding="utf-8")), encoding="utf-8")

          root_gradle = pathlib.Path("android/build.gradle")
          if root_gradle.exists():
              r_text = root_gradle.read_text(encoding="utf-8")
              if "ext.kotlin_version" not in r_text:
                  r_text = f"buildscript {{\n    ext.kotlin_version = '{kotlin_ver}'\n}}\n\n" + r_text
              force_block = """
subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                compileSdkVersion 34
                buildToolsVersion "34.0.0"
            }
        }
        project.configurations.all {
            resolutionStrategy.eachDependency { details ->
                if (details.requested.group == 'org.jetbrains.kotlin') {
                    details.useVersion '2.0.21'
                }
            }
        }
    }
}
"""
              if "subprojects {" not in r_text:
                  r_text = r_text + "\n" + force_block
              root_gradle.write_text(r_text, encoding="utf-8")

          for path_str, is_kts in [
              ("android/app/build.gradle", False),
              ("android/app/build.gradle.kts", True),
          ]:
              p = pathlib.Path(path_str)
              if not p.exists():
                  continue
              lines = p.read_text(encoding="utf-8").splitlines()
              out = []
              for line in lines:
                  s = line.lstrip()
                  ind = line[: len(line) - len(s)]
                  if re.match(r"^(compileSdkVersion|compileSdk)\b", s):
                      out.append(f"{ind}compileSdk = 34" if is_kts else f"{ind}compileSdk 34")
                  elif re.match(r"^(targetSdkVersion|targetSdk)\b", s):
                      out.append(f"{ind}targetSdk = 34" if is_kts else f"{ind}targetSdk 34")
                  elif re.match(r"^(minSdkVersion|minSdk)\b", s):
                      out.append(f"{ind}minSdk = 21" if is_kts else f"{ind}minSdk 21")
                  else:
                      out.append(line)
              p.write_text("\n".join(out) + "\n", encoding="utf-8")
          EOF

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: multi-branch-manager-apk
          path: build/app/outputs/flutter-apk/app-release.apk
