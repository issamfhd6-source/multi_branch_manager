name: 3b2b1 - Debug Gradle Error

on:
  workflow_dispatch:

jobs:
  debug-gradle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: stable
          cache: true

      - name: Install dependencies and generate Drift
        run: |
          flutter pub get
          if grep -rn "@DriftDatabase" lib/ >/dev/null 2>&1; then
            dart run build_runner build --delete-conflicting-outputs
          fi

      - name: Prepare Android project
        run: |
          rm -rf android
          flutter create --platforms=android --org com.example .

          python3 - << 'PY'
          import pathlib, re

          kotlin_ver = "2.0.21"
          agp_ver = "8.3.2"

          for path in pathlib.Path("android").rglob("*.gradle*"):
              text = path.read_text(encoding="utf-8")
              text = re.sub(
                  r'(id\s*\(?["\']org\.jetbrains\.kotlin\.android["\']\)?\s*(?:version\s*)?["\'])[^"\']+(["\'])',
                  rf'\g<1>{kotlin_ver}\g<2>',
                  text,
              )
              text = re.sub(
                  r'(id\s*\(?["\']com\.android\.application["\']\)?\s*(?:version\s*)?["\'])[^"\']+(["\'])',
                  rf'\g<1>{agp_ver}\g<2>',
                  text,
              )
              text = re.sub(
                  r'(ext\.kotlin_version\s*=\s*["\'])[^"\']+(["\'])',
                  rf'\g<1>{kotlin_ver}\g<2>',
                  text,
              )
              text = re.sub(
                  r'(com\.android\.tools\.build:gradle:)[^"\'\s]+',
                  rf'\g<1>{agp_ver}',
                  text,
              )
              text = re.sub(
                  r'(org\.jetbrains\.kotlin:kotlin-gradle-plugin:)[^"\'\s]+',
                  rf'\g<1>{kotlin_ver}',
                  text,
              )
              text = re.sub(r'\bcompileSdk\s*=?\s*\d+', 'compileSdk = 34', text)
              text = re.sub(r'\bcompileSdkVersion\s*=?\s*\d+', 'compileSdkVersion = 34', text)
              text = re.sub(r'\btargetSdk\s*=?\s*\d+', 'targetSdk = 34', text)
              text = re.sub(r'\btargetSdkVersion\s*=?\s*\d+', 'targetSdkVersion = 34', text)
              path.write_text(text, encoding="utf-8")

          root_gradle = pathlib.Path("android/build.gradle")
          if root_gradle.exists():
              rtext = root_gradle.read_text(encoding="utf-8")
              if "subprojects {" not in rtext:
                  rtext += (
                      "\nsubprojects {\n"
                      "    afterEvaluate { project ->\n"
                      "        if (project.hasProperty('android')) {\n"
                      "            project.android {\n"
                      "                compileSdkVersion 34\n"
                      "            }\n"
                      "        }\n"
                      "    }\n"
                      "}\n"
                  )
                  root_gradle.write_text(rtext, encoding="utf-8")
          PY

      - name: Run build with error context printed
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee /tmp/build.log || true
          echo "=== FAILURE LINES ==="
          grep -n -C 5 -E "FAILURE:|What went wrong:|Execution failed|Caused by:|error:" /tmp/build.log | tail -n 45 || true
          grep -q "BUILD FAILED" /tmp/build.log && exit 1 || exit 0
          
