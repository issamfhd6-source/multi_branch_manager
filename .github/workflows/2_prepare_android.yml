name: 2 - Prepare Android

on:
  workflow_dispatch:

jobs:
  prepare-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: stable
      - run: |
          rm -rf android
          flutter create --platforms=android .
          ls -la android android/app
