name: multi_branch_manager
description: Offline-first multi-branch management application with dual SYP (New/Old 1:100), Drift, Supabase, and AI Copilot.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  drift: ^2.20.3
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0
  supabase_flutter: ^2.6.0
  flutter_dotenv: ^5.1.0
  http: ^1.2.2
  local_auth: ^2.3.0
  crypto: ^3.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.20.3
  build_runner: ^2.4.12

flutter:
  uses-material-design: true
  assets:
    - .env.example
    
